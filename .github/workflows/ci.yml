          echo $! > "$RUNNER_TEMP/noc103-access.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18091/public/signup/config >/dev/null; then break; fi
            sleep 1
          done
          (cd frontend && npx playwright test signup.spec.ts)
      - name: Validate unified wireless fiber hybrid map and strand reservations
        env:
          NOC_PROJECT: noc84-wisp-test
          NOC_ACCEPTANCE_STATE: ${{ runner.temp }}/noc85-wisp-state
          NOC104_UNIFIED_BROWSER: "true"
        run: |
          scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T backend python -m app.unified.rehearsal > "$NOC_ACCEPTANCE_STATE/unified-fixture.json"
          (cd frontend && npx playwright test unified.spec.ts)
      - name: Validate offline terrain subprocesses, predicted coverage and private planning workflow
        env:
          APP_ENV: staging
          OFFLINE_MODE: "true"
          SYNTHETIC_MONITORING_ENABLED: "true"
          NOC_PROJECT: noc84-wisp-test
          NOC_ACCEPTANCE_STATE: ${{ runner.temp }}/noc85-wisp-state
          NOC105_PLANNING_BROWSER: "true"
        run: |
          scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T backend python -m app.planning.rehearsal > "$NOC_ACCEPTANCE_STATE/planning-fixture.json"
          (cd frontend && npx playwright test planning.spec.ts)
      - name: Validate approved Fiber Designer exports, preview-only scheduler and private dashboard
        env:
          APP_ENV: staging
          OFFLINE_MODE: "true"
          SYNTHETIC_MONITORING_ENABLED: "true"
          NOC_PROJECT: noc84-wisp-test
          NOC_ACCEPTANCE_STATE: ${{ runner.temp }}/noc85-wisp-state
          NOC106_FIBER_BROWSER: "true"
        run: |
          scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T backend python -m app.fiber_sync.rehearsal > "$NOC_ACCEPTANCE_STATE/fiber-sync-fixture.json"
          scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T -e FIBER_DESIGNER_WORKER_ENABLED=true backend python -m app.fiber_sync.worker --once
          (cd frontend && npx playwright test fiber-sync.spec.ts)
      - name: Validate private operational finance, allocations and advisory scenarios
        env:
          APP_ENV: staging
          OFFLINE_MODE: "true"
          SYNTHETIC_MONITORING_ENABLED: "true"
          NOC_PROJECT: noc84-wisp-test
          NOC_ACCEPTANCE_STATE: ${{ runner.temp }}/noc85-wisp-state
          NOC107_FINANCE_BROWSER: "true"
        run: |
          scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T backend python -m app.finance.rehearsal > "$NOC_ACCEPTANCE_STATE/finance-fixture.json"
          (cd frontend && npx playwright test finance.spec.ts)
      - name: Validate private monitoring analytics without contacting Grafana
        env:
          NOC_PROJECT: noc84-wisp-test
          NOC_ACCEPTANCE_STATE: ${{ runner.temp }}/noc85-wisp-state
          NOC108_ANALYTICS_BROWSER: "true"
        run: |
          scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T backend python -m app.analytics.rehearsal > "$NOC_ACCEPTANCE_STATE/analytics-fixture.json"
          (cd frontend && npx playwright test '(^|/)analytics\.spec\.ts$')
      - name: Validate approval-controlled customer communications and public-only WordPress status
        env:
          NOC_PROJECT: noc84-wisp-test
          NOC_ACCEPTANCE_STATE: ${{ runner.temp }}/noc85-wisp-state
          NOC109_STATUS_BROWSER: "true"
        run: |
          (cd frontend && npm run build:status)
          scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T backend python -m app.customer_status.rehearsal > "$NOC_ACCEPTANCE_STATE/customer-status-fixture.json"
          scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T -d backend sh -c 'exec env CUSTOMER_STATUS_RATE_KEY_FILE=/var/lib/nwo-noc/monitoring/customer-status-rate-key uvicorn app.customer_status.public_app:app --host 127.0.0.1 --port 8002 --no-access-log'
          nohup python3 scripts/release/status-access.py "$NOC_ACCEPTANCE_STATE" > "$RUNNER_TEMP/noc109-access.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/noc109-access.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18092/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18092/health >/dev/null
          (cd frontend && npx playwright test customer-status.spec.ts)
      - name: Validate consolidated shell error recovery and role-aware navigation
        env:
          NOC_ACCEPTANCE_STATE: ${{ runner.temp }}/noc85-wisp-state
          NOC110_INTEGRATION_BROWSER: "true"
        run: (cd frontend && npx playwright test shell-integration.spec.ts)
      - name: Validate audited login accessibility and rate-limit error handling
        env:
          NOC111_AUDIT_BROWSER: "true"
        run: (cd frontend && npx playwright test audit.spec.ts)
      - name: Validate immutable old-release upgrade, failed-upgrade rollback and matching restore
        run: scripts/release/rehearse-upgrade.sh "$RUNNER_TEMP/noc93-upgrade-state"
      - name: Stop isolated acceptance services, retain volumes
        if: always()
        run: |
          scripts/release/manage.sh "$RUNNER_TEMP/noc84-state" down
          if [ -f "$RUNNER_TEMP/noc93-upgrade-state/acceptance.env" ]; then
            NOC_PROJECT=noc84-noc93upgrade scripts/release/manage.sh "$RUNNER_TEMP/noc93-upgrade-state" down
          fi
          if [ -f "$RUNNER_TEMP/noc85-wisp-state/acceptance.env" ]; then
            NOC_PROJECT=noc84-wisp-test scripts/release/manage.sh "$RUNNER_TEMP/noc85-wisp-state" down
          fi


  wordpress-status:
    name: WordPress public status acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build reviewed backend for isolated synthetic fixture
        run: docker build -t noc128-backend:test backend
      - name: Build and scan exact restricted public proxy
        run: |
          docker build -t noc128-status-proxy:test -f deploy/Dockerfile.status-proxy .
          python3 scripts/release/image_security.py --require-no-high --output "$RUNNER_TEMP/wordpress-evidence-proxy-scan" noc128-status-proxy:test
      - name: Install locked browser test dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Execute actual disposable WordPress installation and TLS retrieval
        run: python3 scripts/wordpress/acceptance.py "$RUNNER_TEMP/wordpress-evidence"
      - name: Preserve plugin ZIP, checksum and compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wordpress-status-plugin-and-acceptance
          path: |
            ${{ runner.temp }}/wordpress-evidence/plugin
            ${{ runner.temp }}/wordpress-evidence/compatibility.json
            ${{ runner.temp }}/wordpress-evidence/proxy-isolation.json
            ${{ runner.temp }}/wordpress-evidence/wordpress-*.json
            ${{ runner.temp }}/wordpress-evidence-proxy-scan
          if-no-files-found: error
