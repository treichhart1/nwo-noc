name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-security:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: 'pip install --require-hashes --only-binary=:all: -r backend/requirements-audit.lock'
      - run: pip-audit -r backend/requirements-test.lock -r backend/requirements-audit.lock --vulnerability-service pypi --format json --output pip-audit.json
      - name: Audit undefined Python names and reviewed security findings
        run: |
          python scripts/release/check_supply_chain.py
          python scripts/release/sbom.py > source-locks.spdx.json
          ruff check backend/app scripts --select F821,F822,F823
          bandit -r backend/app -f json -o bandit.json --exit-zero
          python scripts/release/check_audit_findings.py bandit.json
          bandit -r scripts/host -f json -o installer-bandit.json --exit-zero
          python scripts/release/check_audit_findings.py installer-bandit.json docs/audits/NOC-113-installer-bandit-review.json
      - name: Audit npm dependencies and preserve complete findings
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm ls picomatch tinyglobby fdir vite --all --json > "$GITHUB_WORKSPACE/npm-dependency-chain.json"
          npm explain picomatch --json > "$GITHUB_WORKSPACE/npm-picomatch-explain.json"
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto"); console.log(JSON.stringify({node:process.version,lock_sha256:crypto.createHash("sha256").update(fs.readFileSync("package-lock.json")).digest("hex")}))' > "$GITHUB_WORKSPACE/npm-lock-runtime.json"
          git diff --exit-code -- package.json package-lock.json
          set +e
          npm audit --json --audit-level=low > "$GITHUB_WORKSPACE/npm-audit.json"
          result=$?
          set -e
          node -e 'console.log(JSON.stringify(require(process.env.GITHUB_WORKSPACE+"/npm-audit.json").metadata))'
          exit "$result"
      - name: Independently hash and reconcile final NOC119 run730 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/noc119-artifacts"
          python3 - <<'PY' > "$RUNNER_TEMP/noc119-artifact-ids"
          import json
          data=json.load(open('docs/release/NOC-120/NOC-119-EVIDENCE.json'))
          assert data['repository']=='treichhart1/nwo-noc' and data['run_id']==45127023991
          for item in data['artifacts']: print(item['id'])
          PY
          while read -r artifact; do
            gh api "repos/treichhart1/nwo-noc/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/noc119-artifacts/$artifact.zip"
          done < "$RUNNER_TEMP/noc119-artifact-ids"
          python3 scripts/release/reconcile_evidence.py --directory "$RUNNER_TEMP/noc119-artifacts" --output noc119-reconciled-evidence.json
      - name: Verify original NOC128 failed performance artifact without discarding its evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/treichhart1/nwo-noc/actions/artifacts/15220008578/zip > "$RUNNER_TEMP/noc128-failed-performance.zip"
          python3 - <<'PYTHON'
          import json, os
          from scripts.release.reconcile_evidence import inspect_archive
          expected = {"id":15220008578,"name":"pilot-performance-evidence","size_in_bytes":22900,
                      "sha256":"a91b71e703db09763288b2f5db1b3965c18b94426201261a72edde44ffcb1246"}
          report = inspect_archive(os.environ['RUNNER_TEMP']+'/noc128-failed-performance.zip', expected)
          assert len(report['benchmarks']) == 1
          result = report['benchmarks'][0]
          assert result['rounds']==18 and result['over15']==5 and result['max_seconds']==20.780
          assert result['target_status']=='FAIL' and result['counts_preserved']
          with open('noc128-original-failure-evidence.json','w') as output:
              json.dump(report,output,indent=2)
          print(json.dumps(report))
          PYTHON
      - name: Retain source dependency inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: source-dependency-evidence
          path: |
            pip-audit.json
            source-locks.spdx.json
            npm-audit.json
            npm-dependency-chain.json
            npm-picomatch-explain.json
            npm-lock-runtime.json
            noc119-reconciled-evidence.json
            noc128-original-failure-evidence.json
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run build:status
      - run: npm run build:signup

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key
      DATABASE_URL: postgresql+psycopg://nwo_noc:test@localhost:5432/nwo_noc
      ADMIN_PASSWORD: CI-password-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - run: 'pip install --require-hashes --only-binary=:all: -r requirements-test.lock'
      - run: python -m compileall -q app alembic
      - run: python -m pytest -q

  database-migrations:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
        env:
          POSTGRES_DB: nwo_noc
          POSTGRES_USER: nwo_noc
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nwo_noc -d nwo_noc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key
      DATABASE_URL: postgresql+psycopg://nwo_noc:test@localhost:5432/nwo_noc
      ADMIN_PASSWORD: CI-password-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - run: 'pip install --require-hashes --only-binary=:all: -r requirements.lock'
      - name: Apply all migrations
        run: alembic upgrade head
      - name: Confirm migration state is current
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.runtime.migration import MigrationContext
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine
          from app.core.config import settings

          config = Config("alembic.ini")
          script = ScriptDirectory.from_config(config)
          engine = create_engine(settings.database_url)
          with engine.connect() as connection:
              current = set(MigrationContext.configure(connection).get_current_heads())
          expected = set(script.get_heads())
          assert current == expected, (
              f"Database migration heads {sorted(current)} do not match "
              f"repository heads {sorted(expected)}"
          )
          print("Database migration heads match repository heads")
          PY
      - name: Detect missing schema migrations
        run: alembic check
      - name: Verify migration is idempotent
        run: alembic upgrade head

  rf-postgres-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
        env:
          POSTGRES_DB: nwo_noc
          POSTGRES_USER: nwo_noc
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nwo_noc -d nwo_noc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key
      DATABASE_URL: postgresql+psycopg://nwo_noc:test@localhost:5432/nwo_noc
      RF_INTEGRATION_TEST_DATABASE_URL: postgresql+psycopg://nwo_noc:test@localhost:5432/nwo_noc
      ADMIN_PASSWORD: CI-password-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - run: 'pip install --require-hashes --only-binary=:all: -r requirements-test.lock'
      - name: Migrate disposable PostgreSQL database
        run: alembic upgrade head
      - name: Validate native SMS contracts, durable claims and least-privilege callbacks
        run: python -m pytest -q tests/test_sms_providers.py tests/test_sms_postgres.py
      - name: Validate native Slack contracts, durable claims and isolated interactions
        run: python -m pytest -q tests/test_slack_native.py tests/test_slack_postgres.py
      - name: Deploy actual ClamAV engine with safe test definitions
        run: |
          sudo apt-get -o APT::Update::Error-Mode=any update
          sudo apt-get install -y --no-install-recommends clamav-daemon
          clamd --version
      - name: Validate real scanner uploads, safe signature, faults and recovery
        env:
          NOC119_REAL_CLAMAV: "1"
        run: python -m pytest -q tests/test_pilot_security.py
      - name: Validate RF staging preflight in safe and unsafe modes
        env:
          APP_ENV: staging
          RF_COLLECTION_ENABLED: "false"
          RF_HISTORY_PRUNING_ENABLED: "false"
          UISP_VERIFY_TLS: "true"
        run: |
          python scripts/rf_staging_preflight.py
          if RF_COLLECTION_ENABLED=true python scripts/rf_staging_preflight.py; then
            echo "Unsafe RF collection configuration unexpectedly passed"
            exit 1
          fi
          if UISP_VERIFY_TLS=false python scripts/rf_staging_preflight.py; then
            echo "Disabled UISP TLS verification unexpectedly passed"
            exit 1
          fi
          if APP_ENV=production python scripts/rf_staging_preflight.py; then
            echo "Production environment unexpectedly passed staging gate"
            exit 1
          fi
      - name: Run complete RF regression gate against disposable PostgreSQL
        run: |
          python -m pytest -q \
            tests/test_rf_postgres_integration.py \
            tests/test_rf_end_to_end_postgres.py \
            tests/test_rf_staging_acceptance_postgres.py \
            tests/test_rf_site_health_postgres.py \
            tests/test_rf_site_query_budget_postgres.py \
            tests/test_rf_role_regression.py \
            tests/test_rf_release_regression.py \
            tests/test_dashboard_postgres_scale.py \
            tests/test_operations_postgres.py \
            tests/test_monitoring_postgres.py \
            tests/test_operational_readiness_postgres.py \
            tests/test_read_only_integrations_postgres.py \
            tests/test_vendor_rf_postgres.py \
            tests/test_radio_postgres.py \
            tests/test_microwave_postgres.py \
            tests/test_rf_analytics_postgres.py \
            tests/test_rf_troubleshooting_postgres.py \
            tests/test_rf_operations_postgres.py \
            tests/test_monitoring_reliability.py \
            tests/test_mikrotik_native.py \
            tests/test_release_combined_postgres.py \
            tests/test_final_release_security.py \
            tests/test_powercode_customers.py \
            tests/test_notifications.py \
            tests/test_notification_expansion.py \
            tests/test_down_detector.py \
            tests/test_tower_health.py \
            tests/test_ipam.py \
            tests/test_equipment.py \
            tests/test_field.py \
            tests/test_maintenance_documents.py \
            tests/test_signup.py \
            tests/test_unified.py \
            tests/test_planning.py \
            tests/test_fiber_sync.py \
            tests/test_finance.py
      - name: Measure operational finance at40 synthetic POPs
        run: python -m app.finance.benchmark
      - name: Validate private Grafana analytics and bounded synthetic history
        working-directory: backend
        run: |
          python -m pytest -q tests/test_grafana_analytics.py
          python -m app.analytics.benchmark
      - name: Validate approved public status and native notification integration
        env:
          APP_ENV: staging
          OFFLINE_MODE: "true"
          SYNTHETIC_MONITORING_ENABLED: "true"
        run: |
          python -m pytest -q tests/test_customer_network_status.py tests/test_wordpress_status.py
          python -m app.customer_status.benchmark
      - name: Validate combined NOC110 cross-module operational workflows
        run: python -m pytest -q -s tests/test_full_integration.py tests/test_release_acceptance.py tests/test_release_blockers.py
      - name: Validate NOC111 audit security and profile site summaries
        env:
          APP_ENV: staging
          OFFLINE_MODE: "true"
          SYNTHETIC_MONITORING_ENABLED: "true"
        run: |
          python -m pytest -q tests/test_comprehensive_audit.py
          python -m app.audit_sites_benchmark
      - name: Measure approved fiber reconciliation at40 synthetic POPs
        run: python -m app.fiber_sync.benchmark
      - name: Measure offline terrain coverage at40 synthetic POPs
        run: python -m app.planning.benchmark
      - name: Measure unified40 POP physical logical and customer impact graphs
        env:
          APP_ENV: staging
          OFFLINE_MODE: "true"
          SYNTHETIC_MONITORING_ENABLED: "true"
        run: python -m app.unified.benchmark
      - name: Measure encrypted signup workflows at40 POPs
        env:
          APP_ENV: staging
          OFFLINE_MODE: "true"
          SYNTHETIC_MONITORING_ENABLED: "true"
        run: python -m app.signup.benchmark
      - name: Measure preventive maintenance and document metadata at40 POPs
        env:
          APP_ENV: staging
          OFFLINE_MODE: "true"
          SYNTHETIC_MONITORING_ENABLED: "true"
        run: python -m app.maintenance_ops.benchmark
      - name: Measure authenticated QR and field work pages at40 POPs
        env:
          APP_ENV: staging
          OFFLINE_MODE: "true"
          SYNTHETIC_MONITORING_ENABLED: "true"
        run: python -m app.field.benchmark
      - name: Measure physical inventory at 40 POPs and1000/10000 assets
        env:
          APP_ENV: staging
          OFFLINE_MODE: "true"
          SYNTHETIC_MONITORING_ENABLED: "true"
        run: python -m app.equipment.benchmark
      - name: Measure IPAM at 40 POPs and1000/10000 synthetic assignments
        env:
          APP_ENV: staging
          OFFLINE_MODE: "true"
          SYNTHETIC_MONITORING_ENABLED: "true"
        run: python -m app.ipam.benchmark
      - name: Measure tower health at 40 POPs and 250/500/1000 devices
        env:
          APP_ENV: staging
          OFFLINE_MODE: "true"
          SYNTHETIC_MONITORING_ENABLED: "true"
        run: python -m app.tower_health.benchmark
      - name: Measure synthetic Down Detector correlation at 250/500/1000 devices
        env:
          APP_ENV: staging
          OFFLINE_MODE: "true"
          SYNTHETIC_MONITORING_ENABLED: "true"
        run: python -m app.down_detector.benchmark
      - name: Measure 30-day historical analytics at 250/500/1000 devices
        env:
          APP_ENV: staging
          OFFLINE_MODE: "true"
        run: PYTHONPATH=. python -m app.rf_analytics_benchmark
      - name: Measure unified RF operations, incident pagination and concurrent sessions
        env:
          APP_ENV: staging
          OFFLINE_MODE: "true"
        run: PYTHONPATH=. python -m app.rf_operations_benchmark
      - name: Measure durable RF polling and alert recovery at 250/500/1000 devices
        env:
          APP_ENV: staging
          OFFLINE_MODE: "true"
          SYNTHETIC_MONITORING_ENABLED: "true"
          RF_SCHEDULER_ENABLED: "true"
        run: PYTHONPATH=. python -m app.monitoring_benchmark
      - name: Recheck six-round polling in the actual hardened backend runtime
        env:
          APP_ENV: staging
          OFFLINE_MODE: "true"
          SYNTHETIC_MONITORING_ENABLED: "true"
          RF_SCHEDULER_ENABLED: "true"
        run: |
          docker build -t noc118-runtime-benchmark .
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --network host --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            -e SECRET_KEY -e ADMIN_PASSWORD -e DATABASE_URL -e APP_ENV -e OFFLINE_MODE \
            -e SYNTHETIC_MONITORING_ENABLED -e RF_SCHEDULER_ENABLED \
            --entrypoint python noc118-runtime-benchmark -m app.monitoring_benchmark
      - name: Measure synthetic WISP operational readiness at 250/500/1000 devices
        env:
          APP_ENV: staging
          OFFLINE_MODE: "true"
        run: PYTHONPATH=. python scripts/benchmark_operational_readiness.py
      - name: Validate actual worker processes at 250/500/1000 synthetic devices
        env:
          APP_ENV: staging
          OFFLINE_MODE: "true"
          NOC85_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: PYTHONPATH=. python scripts/validate_worker_scale.py
      - name: Benchmark RF health with synthetic radios (informational)
        run: |
          PYTHONPATH=. python scripts/benchmark_rf_health.py --devices 250 --history 20 --repeats 3
          PYTHONPATH=. python scripts/benchmark_rf_health.py --devices 1000 --history 20 --repeats 3

  compose-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate Compose configuration without deployment
        env:
          POSTGRES_DB: nwo_noc
          POSTGRES_USER: nwo_noc
          POSTGRES_PASSWORD: ci-only
          SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key
          DATABASE_URL: postgresql+psycopg://nwo_noc:ci-only@db:5432/nwo_noc
          ADMIN_PASSWORD: CI-password-only
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose config --format json > /tmp/noc-compose.json
          python3 scripts/validate_compose_network.py /tmp/noc-compose.json
      - name: Reproduce exact NOC117 source and immutable database baseline
        run: |
          mkdir "$RUNNER_TEMP/noc117-baseline"
          git archive 752939ade1ae3ffd167bf484d7b84c6b90b244b4 backend frontend | tar -x -C "$RUNNER_TEMP/noc117-baseline"
          docker build -t noc117-baseline-backend "$RUNNER_TEMP/noc117-baseline/backend"
          docker build -t noc117-baseline-frontend "$RUNNER_TEMP/noc117-baseline/frontend"
          docker pull postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
          docker pull postgres:16-alpine3.23@sha256:9afe26709faad4c173fea5380b215bd6eb9691b05aa1be5b86cec8e0285da914
          docker pull redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
          python3 scripts/release/image_security.py --output baseline-image-security-evidence postgres:16-alpine3.23@sha256:9afe26709faad4c173fea5380b215bd6eb9691b05aa1be5b86cec8e0285da914 noc117-baseline-backend noc117-baseline-frontend postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
      - name: Build release images without starting services
        run: docker compose build
      - name: Record native and application image vulnerability and license evidence
        run: |
          docker image inspect noc120-redis:rc >/dev/null
          python3 scripts/release/image_security.py --output image-security-evidence $(docker compose config --images | sort -u)
      - name: Retain source-specific native vulnerability review details
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for path in sorted(Path('image-security-evidence').glob('image-*.json')):
              doc=json.loads(path.read_text())
              for result in doc.get('Results',[]):
                  for item in result.get('Vulnerabilities',[]) or []:
                      rows.append({'image_id':doc['Metadata']['ImageID'],'cve':item['VulnerabilityID'],
                          'package':item.get('PkgName'),'installed':item.get('InstalledVersion'),
                          'fixed':item.get('FixedVersion'),'status':item.get('Status'),'severity':item['Severity'],
                          'source':item.get('DataSource',{}).get('ID')})
          Path('image-security-evidence/native-review.json').write_text(json.dumps(rows,indent=2)+'\n')
          print(json.dumps({'native_review':rows}))
          PY
      - name: Export full baseline and candidate image SPDX inventories
        run: |
          python3 scripts/release/image_sbom.py baseline-image-security-evidence
          python3 scripts/release/image_sbom.py image-security-evidence
      - name: Record backend attack surface and ABI acceptance
        run: |
          docker run --rm --read-only --cap-drop ALL --network none --tmpfs /tmp:rw,noexec,nosuid,size=32m --entrypoint python nwo-noc-backend scripts/backend_runtime_evidence.py > image-security-evidence/backend-runtime.json
      - name: Record database helper and Redis runtime compatibility metadata
        run: |
          docker run --rm --read-only --network none --entrypoint sh noc117-postgres:rc -c 'postgres --version; gosu --version; gosu postgres id' > image-security-evidence/postgres-runtime.txt
          docker run --rm --read-only --network none --entrypoint sh noc120-redis:rc -c 'redis-server --version; redis-cli --version; id redis; apk info -v libcrypto3 libssl3 zlib' > image-security-evidence/redis-runtime.txt
      - name: Bind unsigned build provenance to source inputs and retained reports
        run: python3 scripts/release/build_provenance.py image-security-evidence
      - name: Retain image security findings (not release approval)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-image-security-evidence
          path: |
            image-security-evidence
            baseline-image-security-evidence
          if-no-files-found: error
      - name: Validate offline staging egress policy and synthetic staging config
        run: |
          python3 scripts/validate_staging_egress_policy.py docs/noc-75x-staging-egress-policy.json
          cat > /tmp/noc-ci-staging.env <<'EOF'
          APP_ENV=staging
          BIND_ADDRESS=127.0.0.1
          RF_COLLECTION_ENABLED=false
          RF_HISTORY_PRUNING_ENABLED=false
          API_DOCS_ENABLED=false
          UISP_VERIFY_TLS=true
          CORS_ORIGINS=http://127.0.0.1:8090
          DATABASE_URL=postgresql+psycopg://ci:ci@db:5432/staging
          REDIS_URL=redis://redis:6379/0
          EOF
          python3 scripts/validate_staging_isolation.py --compose-json /tmp/noc-compose.json --env-file /tmp/noc-ci-staging.env
          sed 's/^RF_COLLECTION_ENABLED=false$/RF_COLLECTION_ENABLED=true/' /tmp/noc-ci-staging.env > /tmp/noc-ci-unsafe.env
          if python3 scripts/validate_staging_isolation.py --compose-json /tmp/noc-compose.json --env-file /tmp/noc-ci-unsafe.env; then
            echo "Unsafe staging RF configuration unexpectedly passed"
            exit 1
          fi
          echo "Offline staging lint and negative-control check passed; runtime isolation not verified"
      - name: Validate isolated public status gateway configuration without starting services
        env:
          NOC_STATUS_BACKEND_IMAGE: synthetic-noc-status:ci
          NOC_STATUS_DB_URL_FILE: /dev/null
          NOC_STATUS_RATE_KEY_FILE: /dev/null
          NOC_STATUS_PG_CA_FILE: /dev/null
        run: docker compose -f deploy/compose.customer-status.yml config --quiet

  host-package-acceptance:
    name: Ubuntu 24.04 approved host package
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Build complete application artifacts for controlled host acceptance
        run: |
          docker build -t noc113-backend:base backend
          docker build -t noc113-frontend:base frontend
          docker build -t noc117-postgres:rc -f deploy/Dockerfile.postgres .
          docker build -t noc120-redis:rc -f deploy/Dockerfile.redis .
      - name: Verify old Redis7 data and queues survive supported-library upgrade and restart
        run: python3 tests/installer/redis_upgrade.py --execute-disposable-test
      - name: Reject temporary PostgreSQL initialization servers using actual deployment health checks
        run: |
          sudo apt-get install -y --no-install-recommends python3-yaml
          python3 tests/installer/postgres_readiness.py --postgres noc117-postgres:rc --execute-disposable-test
      - name: Execute disposable Ubuntu systemd install, verification, encrypted restore and upgrade failure acceptance
        run: sudo python3 tests/installer/test_ubuntu_host.py --workspace /var/tmp/noc113-acceptance --extended
      - name: Scan the exact immutable runtime images exercised by Ubuntu acceptance
        run: |
          sudo python3 - <<'PY'
          import json, subprocess
          images = json.load(open('/var/tmp/noc113-acceptance/runtime-images.json'))
          images = sorted(set(images + subprocess.check_output(['docker','image','inspect','--format','{{.Id}}','noc113-backend:base','noc117-postgres:rc'],text=True).split()))
          assert images, 'No tested immutable image identities'
          subprocess.run(['python3', 'scripts/release/image_security.py', '--require-no-high', '--output', 'host-runtime-image-security-evidence', *images], check=True)
          subprocess.run(['python3', 'scripts/release/image_sbom.py', 'host-runtime-image-security-evidence'], check=True)
          subprocess.run(['python3', 'scripts/release/build_provenance.py', 'host-runtime-image-security-evidence'], check=True)
          PY
      - name: Preserve exact installation-image scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ubuntu-tested-runtime-security-evidence
          path: host-runtime-image-security-evidence
          if-no-files-found: error
      - name: Build disposable Ubuntu failure-test control image
        run: docker build -f deploy/Dockerfile.installer-failures -t noc114-installer-failures .
      - name: Exercise real fresh-install failures without deleting retained state
        run: |
          sudo mkdir -m 700 /var/tmp/noc114-failures
          for stage in resources dependencies database migration startup interrupted; do
            docker run --rm --network none \
              --tmpfs /noc114-small:rw,size=64m \
              -v "$PWD:$PWD:ro" -w "$PWD" \
              -v /var/tmp/noc114-failures:/var/tmp/noc114-failures \
              -v /var/run/docker.sock:/var/run/docker.sock \
              noc114-installer-failures python3 tests/installer/test_ubuntu_host.py \
              --rehearsal --failure-stage "$stage" --workspace "/var/tmp/noc114-failures/$stage"
          done
      - name: Reject unsupported OS before any installation changes
        run: |
          unsupported_image=python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
          docker pull "$unsupported_image"
          set +e
          docker run --rm --network none --read-only --cap-drop ALL --user 0:0 \
            -v "$PWD:/source:ro" --entrypoint python "$unsupported_image" \
            /source/scripts/host/manager.py install > /tmp/noc114-unsupported.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -F 'Ubuntu Server24.04LTS required; no host changes made' /tmp/noc114-unsupported.log

      - name: Repeat polling with explicit CPU and memory limits on an internal-only network
        run: python3 scripts/release/pilot_benchmark.py --backend noc113-backend:base --postgres noc117-postgres:rc --output pilot-performance-evidence/benchmark.json --require-target
      - name: Retain bounded benchmark records including target failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pilot-performance-evidence
          path: pilot-performance-evidence
          if-no-files-found: error

  independent-pilot:
    name: Independent Ubuntu VM reboot and second-host recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    needs: [dependency-security, backend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Provision disposable hypervisor tooling only
        run: |
          sudo apt-get -o APT::Update::Error-Mode=any update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils age python3-yaml openssl
      - name: Align empty disposable controller with OCI image identity storage
        run: sudo env GITHUB_ACTIONS=true GITHUB_RUN_ID="$GITHUB_RUN_ID" SUDO_UID="$(id -u)" python3 tests/installer/controller_image_store.py --execute-disposable-ci
      - name: Validate explicit guest CPU ABI against actual QEMU models
        run: python3 tests/installer/cpu_contract.py --execute-qemu
      - name: Prepare audited guided lab bundle before controller privilege drop
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_RUN_ID python3 tests/installer/guided_controller.py > guided-controller.json
          docker tag noc123-lab-backend noc113-backend:base
          docker tag noc123-lab-frontend noc113-frontend:base
          docker tag noc123-lab-postgres noc117-postgres:rc
          docker tag noc123-lab-redis noc120-redis:rc
      - name: Execute separate Ubuntu kernels, reboot and authenticated recovery
        run: python3 tests/installer/hypervisor_launch.py --execute-disposable-vms --work "$RUNNER_TEMP/noc119-vms"
      - name: Preserve sanitized VM evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: independent-pilot-vm-evidence
          path: |
            pilot-vm-evidence
            pilot-guided-evidence
            pilot-hypervisor-access.json
          if-no-files-found: error

  rf-release-acceptance:
    name: RF offline release acceptance
    runs-on: ubuntu-24.04
    needs:
      - clean-install-acceptance
      - host-package-acceptance
      - independent-pilot
      - frontend
      - backend
      - database-migrations
      - rf-postgres-integration
      - dependency-security
      - compose-validation
      - wordpress-status
    if: ${{ always() }}
    steps:
      - name: Require all RF release dependencies to pass
        env:
          HOST_PACKAGE_RESULT: ${{ needs.host-package-acceptance.result }}
          PILOT_VM_RESULT: ${{ needs.independent-pilot.result }}
          INSTALL_RESULT: ${{ needs.clean-install-acceptance.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          MIGRATIONS_RESULT: ${{ needs.database-migrations.result }}
          SECURITY_RESULT: ${{ needs.dependency-security.result }}
          RF_RESULT: ${{ needs.rf-postgres-integration.result }}
          WORDPRESS_RESULT: ${{ needs.wordpress-status.result }}
          COMPOSE_RESULT: ${{ needs.compose-validation.result }}
        run: |
          for name in HOST_PACKAGE_RESULT PILOT_VM_RESULT INSTALL_RESULT FRONTEND_RESULT BACKEND_RESULT MIGRATIONS_RESULT RF_RESULT COMPOSE_RESULT SECURITY_RESULT WORDPRESS_RESULT; do
            result="${!name}"
            if [ "$result" != "success" ]; then
              echo "::error::$name is $result, expected success"
              exit 1
            fi
          done
          echo "RF offline CI acceptance passed; staging and production are NOT approved."
          {
            echo "## RF offline acceptance"
            echo "All required backend, database migration, RF PostgreSQL, and Compose checks passed."
            echo ""
            echo "**Scope:** synthetic/disposable CI only. No live UISP/MikroTik integration or staging validation."
            echo "**Release status:** not approved for production."
          } >> "$GITHUB_STEP_SUMMARY"

  clean-install-acceptance:
    name: Ubuntu 24.04 isolated installation and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build application images
        run: |
          docker build -t noc84-backend:rc backend
          docker build -t noc84-frontend:rc frontend
          docker build -t noc117-postgres:rc -f deploy/Dockerfile.postgres .
          docker build -t noc120-redis:rc -f deploy/Dockerfile.redis .
      - name: Verify backend native geospatial runtime without network access
        run: docker run --rm --network none -e SECRET_KEY=ci-native-runtime-secret-key-ci-native-runtime -e ADMIN_PASSWORD=CI-password-only -e DATABASE_URL=postgresql+psycopg://synthetic:synthetic@127.0.0.1/nwo_noc --entrypoint python noc84-backend:rc -c "import app.main; import rasterio; import pyproj; import laspy; print('Native geospatial backend imports passed')"
      - name: Rehearse Ubuntu installation in a fresh userspace container
        run: scripts/release/rehearse-ubuntu.sh "$RUNNER_TEMP/noc84-state"
      - name: Start loopback access to internal-only stack
        run: |
          nohup python3 scripts/release/access.py "$RUNNER_TEMP/noc84-state" > "$RUNNER_TEMP/noc84-access.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/noc84-access.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18090/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: API, worker, isolation, restart and backup recovery acceptance
        env:
          NOC_ACCEPTANCE_STATE: ${{ runner.temp }}/noc84-state
        run: python3 tests/release/test_acceptance.py
      - name: Browser acceptance with synthetic data
        env:
          NOC_ACCEPTANCE_STATE: ${{ runner.temp }}/noc84-state
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Validate durable logout, nonroot runtime, restricted DB and operator stop
        env:
          NOC_ACCEPTANCE_STATE: ${{ runner.temp }}/noc84-state
          NOC94_SECURITY_BROWSER: "true"
        run: |
          (cd frontend && npx playwright test final-security.spec.ts)
          python3 tests/release/test_final_security.py
      - name: Validate 400-device rural WISP operational dashboard
        env:
          NOC85_WISP_BROWSER: "true"
          NOC_ACCEPTANCE_STATE: ${{ runner.temp }}/noc85-wisp-state
        run: |
          python3 scripts/release/configure.py "$NOC_ACCEPTANCE_STATE"
          printf 'SYNTHETIC_MONITORING_ENABLED=true\nMAINTENANCE_DOCUMENT_SCANNER=synthetic\nMAINTENANCE_SCHEDULER_ENABLED=true\nSIGNUP_PII_KEY_FILE=/var/lib/nwo-noc/signup/pii.key\nSIGNUP_PUBLIC_ENABLED=true\nSIGNUP_PUBLIC_ORIGIN=http://127.0.0.1:18091\nSIGNUP_PUBLIC_TEST_MODE=true\nSIGNUP_TURNSTILE_MODE=fixture\n' >> "$NOC_ACCEPTANCE_STATE/acceptance.env"
          NOC_PROJECT=noc84-wisp-test scripts/release/rehearse-ubuntu.sh "$NOC_ACCEPTANCE_STATE"
          NOC_PROJECT=noc84-wisp-test scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" stop worker
          NOC_PROJECT=noc84-wisp-test scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T backend python -m app.wisp_rehearsal seed
          NOC_PROJECT=noc84-wisp-test scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T backend python -m app.wisp_rehearsal outage
          kill "$(cat "$RUNNER_TEMP/noc84-access.pid")"
          NOC_PROJECT=noc84-wisp-test nohup python3 scripts/release/access.py "$NOC_ACCEPTANCE_STATE" > "$RUNNER_TEMP/noc85-access.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/noc85-access.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18090/health; then break; fi
            sleep 1
          done
          (cd frontend && npx playwright test operational.spec.ts)
          NOC_PROJECT=noc84-wisp-test scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T backend python -m app.wisp_rehearsal recover > "$RUNNER_TEMP/noc85-recovered.json"
          python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); assert v["fresh_up"]==400 and v["active_incidents"]==0' "$RUNNER_TEMP/noc85-recovered.json"
      - name: Validate four-vendor normalized RF foundation without device connections
        env:
          NOC86_RF_BROWSER: "true"
          NOC_ACCEPTANCE_STATE: ${{ runner.temp }}/noc85-wisp-state
        run: |
          NOC_PROJECT=noc84-wisp-test scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T backend python -m app.rf_vendor_rehearsal > "$NOC_ACCEPTANCE_STATE/rf-vendor-devices.json"
