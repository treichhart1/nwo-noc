name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r backend/requirements.txt --vulnerability-service pypi --format json --output pip-audit.json
      - run: npm ci --no-audit --no-fund && npm audit --audit-level=low
        working-directory: frontend
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key
      DATABASE_URL: postgresql+psycopg://nwo_noc:test@localhost:5432/nwo_noc
      ADMIN_PASSWORD: CI-password-only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q app alembic
      - run: python -m pytest -q

  database-migrations:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nwo_noc
          POSTGRES_USER: nwo_noc
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nwo_noc -d nwo_noc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key
      DATABASE_URL: postgresql+psycopg://nwo_noc:test@localhost:5432/nwo_noc
      ADMIN_PASSWORD: CI-password-only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Apply all migrations
        run: alembic upgrade head
      - name: Confirm migration state is current
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.runtime.migration import MigrationContext
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine
          from app.core.config import settings

          config = Config("alembic.ini")
          script = ScriptDirectory.from_config(config)
          engine = create_engine(settings.database_url)
          with engine.connect() as connection:
              current = set(MigrationContext.configure(connection).get_current_heads())
          expected = set(script.get_heads())
          assert current == expected, (
              f"Database migration heads {sorted(current)} do not match "
              f"repository heads {sorted(expected)}"
          )
          print("Database migration heads match repository heads")
          PY
      - name: Detect missing schema migrations
        run: alembic check
      - name: Verify migration is idempotent
        run: alembic upgrade head

  rf-postgres-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nwo_noc
          POSTGRES_USER: nwo_noc
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nwo_noc -d nwo_noc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key
      DATABASE_URL: postgresql+psycopg://nwo_noc:test@localhost:5432/nwo_noc
      RF_INTEGRATION_TEST_DATABASE_URL: postgresql+psycopg://nwo_noc:test@localhost:5432/nwo_noc
      ADMIN_PASSWORD: CI-password-only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Migrate disposable PostgreSQL database
        run: alembic upgrade head
      - name: Validate RF staging preflight in safe and unsafe modes
        env:
          APP_ENV: staging
          RF_COLLECTION_ENABLED: "false"
          RF_HISTORY_PRUNING_ENABLED: "false"
          UISP_VERIFY_TLS: "true"
        run: |
          python scripts/rf_staging_preflight.py
          if RF_COLLECTION_ENABLED=true python scripts/rf_staging_preflight.py; then
            echo "Unsafe RF collection configuration unexpectedly passed"
            exit 1
          fi
          if UISP_VERIFY_TLS=false python scripts/rf_staging_preflight.py; then
            echo "Disabled UISP TLS verification unexpectedly passed"
            exit 1
          fi
          if APP_ENV=production python scripts/rf_staging_preflight.py; then
            echo "Production environment unexpectedly passed staging gate"
            exit 1
          fi
      - name: Run complete RF regression gate against disposable PostgreSQL
        run: |
          python -m pytest -q \
            tests/test_rf_postgres_integration.py \
            tests/test_rf_end_to_end_postgres.py \
            tests/test_rf_staging_acceptance_postgres.py \
            tests/test_rf_site_health_postgres.py \
            tests/test_rf_site_query_budget_postgres.py \
            tests/test_rf_role_regression.py \
            tests/test_rf_release_regression.py \
            tests/test_dashboard_postgres_scale.py \
            tests/test_operations_postgres.py \
            tests/test_monitoring_postgres.py \
            tests/test_operational_readiness_postgres.py \
            tests/test_read_only_integrations_postgres.py \
            tests/test_vendor_rf_postgres.py \
            tests/test_radio_postgres.py \
            tests/test_microwave_postgres.py \
            tests/test_rf_analytics_postgres.py \
            tests/test_rf_troubleshooting_postgres.py \
            tests/test_rf_operations_postgres.py \
            tests/test_monitoring_reliability.py \
            tests/test_release_combined_postgres.py \
            tests/test_final_release_security.py \
            tests/test_powercode_customers.py \
            tests/test_notifications.py
      - name: Measure 30-day historical analytics at 250/500/1000 devices
        env:
          APP_ENV: staging
          OFFLINE_MODE: "true"
        run: PYTHONPATH=. python -m app.rf_analytics_benchmark
      - name: Measure unified RF operations, incident pagination and concurrent sessions
        env:
          APP_ENV: staging
          OFFLINE_MODE: "true"
        run: PYTHONPATH=. python -m app.rf_operations_benchmark
      - name: Measure durable RF polling and alert recovery at 250/500/1000 devices
        env:
          APP_ENV: staging
          OFFLINE_MODE: "true"
          SYNTHETIC_MONITORING_ENABLED: "true"
          RF_SCHEDULER_ENABLED: "true"
        run: PYTHONPATH=. python -m app.monitoring_benchmark
      - name: Measure synthetic WISP operational readiness at 250/500/1000 devices
        env:
          APP_ENV: staging
          OFFLINE_MODE: "true"
        run: PYTHONPATH=. python scripts/benchmark_operational_readiness.py
      - name: Validate actual worker processes at 250/500/1000 synthetic devices
        env:
          APP_ENV: staging
          OFFLINE_MODE: "true"
          NOC85_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: PYTHONPATH=. python scripts/validate_worker_scale.py
      - name: Benchmark RF health with synthetic radios (informational)
        run: |
          PYTHONPATH=. python scripts/benchmark_rf_health.py --devices 250 --history 20 --repeats 3
          PYTHONPATH=. python scripts/benchmark_rf_health.py --devices 1000 --history 20 --repeats 3

  compose-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Compose configuration without deployment
        env:
          POSTGRES_DB: nwo_noc
          POSTGRES_USER: nwo_noc
          POSTGRES_PASSWORD: ci-only
          SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key
          DATABASE_URL: postgresql+psycopg://nwo_noc:ci-only@db:5432/nwo_noc
          ADMIN_PASSWORD: CI-password-only
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose config --format json > /tmp/noc-compose.json
          python3 scripts/validate_compose_network.py /tmp/noc-compose.json
      - name: Build release images without starting services
        run: docker compose build
      - name: Validate offline staging egress policy and synthetic staging config
        run: |
          python3 scripts/validate_staging_egress_policy.py docs/noc-75x-staging-egress-policy.json
          cat > /tmp/noc-ci-staging.env <<'EOF'
          APP_ENV=staging
          BIND_ADDRESS=127.0.0.1
          RF_COLLECTION_ENABLED=false
          RF_HISTORY_PRUNING_ENABLED=false
          API_DOCS_ENABLED=false
          UISP_VERIFY_TLS=true
          CORS_ORIGINS=http://127.0.0.1:8090
          DATABASE_URL=postgresql+psycopg://ci:ci@db:5432/staging
          REDIS_URL=redis://redis:6379/0
          EOF
          python3 scripts/validate_staging_isolation.py --compose-json /tmp/noc-compose.json --env-file /tmp/noc-ci-staging.env
          sed 's/^RF_COLLECTION_ENABLED=false$/RF_COLLECTION_ENABLED=true/' /tmp/noc-ci-staging.env > /tmp/noc-ci-unsafe.env
          if python3 scripts/validate_staging_isolation.py --compose-json /tmp/noc-compose.json --env-file /tmp/noc-ci-unsafe.env; then
            echo "Unsafe staging RF configuration unexpectedly passed"
            exit 1
          fi
          echo "Offline staging lint and negative-control check passed; runtime isolation not verified"

  rf-release-acceptance:
    name: RF offline release acceptance
    runs-on: ubuntu-24.04
    needs:
      - clean-install-acceptance
      - frontend
      - backend
      - database-migrations
      - rf-postgres-integration
      - dependency-security
      - compose-validation
    if: ${{ always() }}
    steps:
      - name: Require all RF release dependencies to pass
        env:
          INSTALL_RESULT: ${{ needs.clean-install-acceptance.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          MIGRATIONS_RESULT: ${{ needs.database-migrations.result }}
          SECURITY_RESULT: ${{ needs.dependency-security.result }}
          RF_RESULT: ${{ needs.rf-postgres-integration.result }}
          COMPOSE_RESULT: ${{ needs.compose-validation.result }}
        run: |
          for name in INSTALL_RESULT FRONTEND_RESULT BACKEND_RESULT MIGRATIONS_RESULT RF_RESULT COMPOSE_RESULT SECURITY_RESULT; do
            result="${!name}"
            if [ "$result" != "success" ]; then
              echo "::error::$name is $result, expected success"
              exit 1
            fi
          done
          echo "RF offline CI acceptance passed; staging and production are NOT approved."
          {
            echo "## RF offline acceptance"
            echo "All required backend, database migration, RF PostgreSQL, and Compose checks passed."
            echo ""
            echo "**Scope:** synthetic/disposable CI only. No live UISP/MikroTik integration or staging validation."
            echo "**Release status:** not approved for production."
          } >> "$GITHUB_STEP_SUMMARY"

  clean-install-acceptance:
    name: Ubuntu 24.04 isolated installation and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build application images
        run: |
          docker build -t noc84-backend:rc backend
          docker build -t noc84-frontend:rc frontend
      - name: Rehearse Ubuntu installation in a fresh userspace container
        run: scripts/release/rehearse-ubuntu.sh "$RUNNER_TEMP/noc84-state"
      - name: Start loopback access to internal-only stack
        run: |
          nohup python3 scripts/release/access.py "$RUNNER_TEMP/noc84-state" > "$RUNNER_TEMP/noc84-access.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/noc84-access.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18090/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: API, worker, isolation, restart and backup recovery acceptance
        env:
          NOC_ACCEPTANCE_STATE: ${{ runner.temp }}/noc84-state
        run: python3 tests/release/test_acceptance.py
      - name: Browser acceptance with synthetic data
        env:
          NOC_ACCEPTANCE_STATE: ${{ runner.temp }}/noc84-state
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Validate durable logout, nonroot runtime, restricted DB and operator stop
        env:
          NOC_ACCEPTANCE_STATE: ${{ runner.temp }}/noc84-state
          NOC94_SECURITY_BROWSER: "true"
        run: |
          (cd frontend && npx playwright test final-security.spec.ts)
          python3 tests/release/test_final_security.py
      - name: Validate 400-device rural WISP operational dashboard
        env:
          NOC85_WISP_BROWSER: "true"
          NOC_ACCEPTANCE_STATE: ${{ runner.temp }}/noc85-wisp-state
        run: |
          python3 scripts/release/configure.py "$NOC_ACCEPTANCE_STATE"
          printf 'SYNTHETIC_MONITORING_ENABLED=true\n' >> "$NOC_ACCEPTANCE_STATE/acceptance.env"
          NOC_PROJECT=noc84-wisp-test scripts/release/rehearse-ubuntu.sh "$NOC_ACCEPTANCE_STATE"
          NOC_PROJECT=noc84-wisp-test scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" stop worker
          NOC_PROJECT=noc84-wisp-test scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T backend python -m app.wisp_rehearsal seed
          NOC_PROJECT=noc84-wisp-test scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T backend python -m app.wisp_rehearsal outage
          kill "$(cat "$RUNNER_TEMP/noc84-access.pid")"
          NOC_PROJECT=noc84-wisp-test nohup python3 scripts/release/access.py "$NOC_ACCEPTANCE_STATE" > "$RUNNER_TEMP/noc85-access.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/noc85-access.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18090/health; then break; fi
            sleep 1
          done
          (cd frontend && npx playwright test operational.spec.ts)
          NOC_PROJECT=noc84-wisp-test scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T backend python -m app.wisp_rehearsal recover > "$RUNNER_TEMP/noc85-recovered.json"
          python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); assert v["fresh_up"]==400 and v["active_incidents"]==0' "$RUNNER_TEMP/noc85-recovered.json"
      - name: Validate four-vendor normalized RF foundation without device connections
        env:
          NOC86_RF_BROWSER: "true"
          NOC_ACCEPTANCE_STATE: ${{ runner.temp }}/noc85-wisp-state
        run: |
          NOC_PROJECT=noc84-wisp-test scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T backend python -m app.rf_vendor_rehearsal > "$NOC_ACCEPTANCE_STATE/rf-vendor-devices.json"
          (cd frontend && npx playwright test vendor-rf.spec.ts)
      - name: Validate Ubiquiti and Cambium radio history and diagnostics without radios
        env:
          NOC87_RF_BROWSER: "true"
          NOC_ACCEPTANCE_STATE: ${{ runner.temp }}/noc85-wisp-state
        run: |
          NOC_PROJECT=noc84-wisp-test scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T backend python -m app.radio_rehearsal > "$NOC_ACCEPTANCE_STATE/rf-radio-devices.json"
          (cd frontend && npx playwright test radio-telemetry.spec.ts)
      - name: Validate dual and multi-carrier microwave history without equipment access
        env:
          NOC88_MICROWAVE_BROWSER: "true"
          NOC_ACCEPTANCE_STATE: ${{ runner.temp }}/noc85-wisp-state
        run: |
          NOC_PROJECT=noc84-wisp-test scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T backend python -m app.microwave_rehearsal > "$NOC_ACCEPTANCE_STATE/microwave-devices.json"
          (cd frontend && npx playwright test microwave.spec.ts)
      - name: Validate historical RF analytics with synthetic baselines and evidence
        env:
          NOC89_ANALYTICS_BROWSER: "true"
          NOC_ACCEPTANCE_STATE: ${{ runner.temp }}/noc85-wisp-state
        run: |
          NOC_PROJECT=noc84-wisp-test scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T backend python -m app.rf_analytics_rehearsal > "$NOC_ACCEPTANCE_STATE/analytics-devices.json"
          (cd frontend && npx playwright test rf-analytics.spec.ts)
      - name: Validate deterministic troubleshooting and human workflow without AI or equipment
        env:
          NOC90_TROUBLESHOOTING_BROWSER: "true"
          NOC_ACCEPTANCE_STATE: ${{ runner.temp }}/noc85-wisp-state
        run: |
          (cd frontend && npx playwright test rf-troubleshooting.spec.ts)
      - name: Validate unified RF operations, shared investigations and responsive unknown states
        env:
          NOC91_OPERATIONS_BROWSER: "true"
          NOC_ACCEPTANCE_STATE: ${{ runner.temp }}/noc85-wisp-state
        run: |
          NOC_PROJECT=noc84-wisp-test scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T backend python -m app.rf_operations_rehearsal > "$NOC_ACCEPTANCE_STATE/operations-devices.json"
          (cd frontend && npx playwright test rf-operations.spec.ts)
      - name: Validate monitoring recovery after real Redis, database and worker interruptions
        env:
          NOC_PROJECT: noc84-wisp-test
          NOC_ACCEPTANCE_STATE: ${{ runner.temp }}/noc85-wisp-state
          NOC92_RECOVERY: "true"
          NOC92_MONITORING_BROWSER: "true"
        run: |
          printf 'RF_SCHEDULER_ENABLED=true\n' >> "$NOC_ACCEPTANCE_STATE/acceptance.env"
          scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" up -d --wait backend worker
          python3 scripts/release/resource_monitor.py "$NOC_ACCEPTANCE_STATE" "$RUNNER_TEMP/noc93-container-resources.json" python3 tests/release/test_monitoring_recovery.py
          (cd frontend && npx playwright test monitoring-reliability.spec.ts)
      - name: Validate synthetic Powercode customers, private mappings and no-delivery impact previews
        env:
          NOC_PROJECT: noc84-wisp-test
          NOC_ACCEPTANCE_STATE: ${{ runner.temp }}/noc85-wisp-state
          NOC95_CUSTOMER_BROWSER: "true"
        run: |
          scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T backend python -m app.powercode_rehearsal > "$NOC_ACCEPTANCE_STATE/customer-fixture.json"
          cat "$NOC_ACCEPTANCE_STATE/customer-fixture.json"
          (cd frontend && npx playwright test customers.spec.ts)
      - name: Validate mock SMS and Slack approvals, customer targeting and durable queue recovery
        env:
          NOC_PROJECT: noc84-wisp-test
          NOC_ACCEPTANCE_STATE: ${{ runner.temp }}/noc85-wisp-state
          NOC96_NOTIFICATION_BROWSER: "true"
        run: |
          scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T backend python -m app.notification_rehearsal seed > "$NOC_ACCEPTANCE_STATE/notification-fixture.json"
          (cd frontend && npx playwright test notifications.spec.ts)
          scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T backend python -m app.notification_rehearsal queue
          scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" restart db worker
          scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" up -d --wait db backend worker
          scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T -e NOTIFICATIONS_WORKER_ENABLED=true backend python -m app.notifications.worker
          scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T -e NOTIFICATIONS_WORKER_ENABLED=true backend python -m app.notifications.worker
          scripts/release/manage.sh "$NOC_ACCEPTANCE_STATE" exec -T backend python -m app.notification_rehearsal verify
      - name: Validate immutable old-release upgrade, failed-upgrade rollback and matching restore
        run: scripts/release/rehearse-upgrade.sh "$RUNNER_TEMP/noc93-upgrade-state"
      - name: Stop isolated acceptance services, retain volumes
        if: always()
        run: |
          scripts/release/manage.sh "$RUNNER_TEMP/noc84-state" down
          if [ -f "$RUNNER_TEMP/noc93-upgrade-state/acceptance.env" ]; then
            NOC_PROJECT=noc84-noc93upgrade scripts/release/manage.sh "$RUNNER_TEMP/noc93-upgrade-state" down
          fi
          if [ -f "$RUNNER_TEMP/noc85-wisp-state/acceptance.env" ]; then
            NOC_PROJECT=noc84-wisp-test scripts/release/manage.sh "$RUNNER_TEMP/noc85-wisp-state" down
          fi
