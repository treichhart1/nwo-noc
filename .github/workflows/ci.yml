name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key
      DATABASE_URL: postgresql+psycopg://nwo_noc:test@localhost:5432/nwo_noc
      ADMIN_PASSWORD: CI-password-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q app alembic
      - run: python -m pytest -q

  database-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nwo_noc
          POSTGRES_USER: nwo_noc
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nwo_noc -d nwo_noc"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key
      DATABASE_URL: postgresql+psycopg://nwo_noc:test@localhost:5432/nwo_noc
      ADMIN_PASSWORD: CI-password-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Apply all migrations
        run: alembic upgrade head
      - name: Confirm migration state is current
        run: alembic current --check-heads
      - name: Verify migration is idempotent
        run: alembic upgrade head

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration without deployment
        env:
          POSTGRES_DB: nwo_noc
          POSTGRES_USER: nwo_noc
          POSTGRES_PASSWORD: ci-only
          SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key
          DATABASE_URL: postgresql+psycopg://nwo_noc:ci-only@db:5432/nwo_noc
          ADMIN_PASSWORD: CI-password-only
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose config --format json > /tmp/noc-compose.json
          python3 - <<'PY'
          import json
          with open('/tmp/noc-compose.json', encoding='utf-8') as handle:
              compose = json.load(handle)
          for name in ('backend', 'frontend'):
              published = compose['services'][name].get('ports', [])
              assert published, f'{name} has no published port to validate'
              for port in published:
                  assert port.get('host_ip') == '127.0.0.1', (name, port)
          print('NOC backend/frontend ports are localhost-only')
          PY
