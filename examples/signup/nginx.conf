# Deploy only on a separately approved HTTPS signup origin. Never use the NOC nginx config.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index signup.html;
    client_max_body_size 32k;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors https://nwohiobb.com https://www.nwohiobb.com" always;
    location /public/signup/ {
        proxy_pass http://signup-gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }    location /public/cancellation/ {
        proxy_pass http://signup-gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location /assets/ { try_files $uri =404; }
    location = / { try_files /signup.html =404; }
    location = /signup.html { try_files $uri =404; }
 location = /cancel.html { try_files $uri =404; }
    location / { return 404; }
}
