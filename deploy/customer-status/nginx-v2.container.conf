# Include limit_req_zone in the HTTP context, not inside a server block.
limit_req_zone $binary_remote_addr zone=noc_public_status:1m rate=30r/m;
server {
    listen 8443 ssl;
    server_name status.example.invalid;
    ssl_certificate /run/secrets/status_tls_certificate;
    ssl_certificate_key /run/secrets/status_tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 5s;
    access_log off; # No addresses, query strings or internal details in public logs.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    location = /network-status-api/v2 {
        limit_except GET { deny all; }
        limit_req zone=noc_public_status burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://status-gateway:8002/public/network-status/v2;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 64 8k;
        proxy_max_temp_file_size 0;
        # Application enforces512KiB. No proxy stale/error caching or redirects.
        proxy_cache off;
    }
    location = /health {
        limit_req zone=noc_public_status burst=2 nodelay;
        proxy_pass http://status-gateway:8002/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
    location / { return 404; }
}
