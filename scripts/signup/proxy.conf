server {
 listen 443 ssl;
 server_name status.noc128.test;
 ssl_certificate /run/secrets/status_tls_certificate;
 ssl_certificate_key /run/secrets/status_tls_private_key;
 ssl_protocols TLSv1.2 TLSv1.3;
 root /usr/share/nginx/html;
 client_max_body_size 32k;
 access_log off;
 add_header Cache-Control "no-store" always;
 add_header X-Content-Type-Options "nosniff" always;
 add_header Referrer-Policy "no-referrer" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors https://wordpress.noc128.test" always;
 location = /health { default_type text/plain; return 200 "signup proxy ready"; }
 location /public/signup/ { proxy_pass http://status-gateway:8002; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_connect_timeout 3s; proxy_read_timeout 10s; }
 location /assets/ { try_files $uri =404; }
 location = /signup.html { try_files $uri =404; }
 location = / { try_files /signup.html =404; }
 location / { return 404; }
}
# CI-only WordPress TLS wrapper; never deploy this block with the public gateway.
server {
 listen 443 ssl;
 server_name wordpress.noc128.test;
 ssl_certificate /run/secrets/status_tls_certificate;
 ssl_certificate_key /run/secrets/status_tls_private_key;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 4m;
 access_log off;
 location / { proxy_pass http://93.184.216.36:80; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
}
